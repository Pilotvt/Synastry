<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synastry Desktop</title>
    <meta name="description" content="Десктопное приложение для расчета натальных карт и синстрии." />

    <meta property="og:title" content="Synastry Desktop" />
    <meta property="og:description" content="Десктопное приложение для расчета натальных карт и синстрии." />
    <meta property="og:image" content="C:\\Users\\user\\Git\\Synastry\\docs\\og-image.jpg" />
    <meta property="og:url" content="https://pilotvt.github.io/Synastry/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #151925;
        --text: #f4f4f6;
        --muted: #c8cbd4;
        --link: #8ab4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .card {
        max-width: 720px;
        width: 100%;
        background: var(--panel);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        letter-spacing: 0.2px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 15px;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      img {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 14px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Synastry Desktop</h1>
      <p>Десктопное приложение для расчета натальных карт и синстрии.</p>
      <a href="https://github.com/Pilotvt/Synastry/releases/tag/v1.0.5">
        GitHub Release v1.0.5
      </a>
      <img src="og-image.jpg" alt="Synastry Desktop" />
    </div>
  </body>
</html>
