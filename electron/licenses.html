<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лицензии</title>
    <style>
      :root {
        --border: rgba(0, 0, 0, 0.18);
        --muted: rgba(0, 0, 0, 0.6);
        --bg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        color: #111;
      }

      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      main {
        height: calc(100% - 49px);
        padding: 12px 16px;
      }

      pre {
        margin: 0;
        height: 100%;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.45;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.02);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Open Source Licenses</h1>
      <div class="meta" id="meta"></div>
    </header>
    <main>
      <pre id="content">Загрузка…</pre>
    </main>
    <script>
      (async () => {
        try {
          const api = window.licensesAPI;
          if (!api) {
            document.getElementById("content").textContent =
              "Не удалось загрузить окно лицензий: preload недоступен.";
            return;
          }
          const data = await api.getNotices();
          const name = data?.appName || "Synastry";
          const version = data?.version ? `v${data.version}` : "";
          document.getElementById("title").textContent = `${name} — Open Source Licenses`;
          document.getElementById("meta").textContent = version ? version : "";
          if (data?.text) {
            document.getElementById("content").textContent = data.text;
          } else {
            const pathInfo = data?.filePath ? `\n\nПуть: ${data.filePath}` : "";
            document.getElementById("content").textContent =
              `Файл THIRD_PARTY_NOTICES.txt не найден или пуст.${pathInfo}`;
          }
        } catch (e) {
          document.getElementById("content").textContent = String(e?.message || e || "Ошибка загрузки.");
        }
      })();
    </script>
  </body>
</html>
