    <script id="embedded-calculations" type="text/plain">Краткое руководство:
<*О программе Synastry*>

*Назначение:* - офлайн/десктоп-приложение для расчёта натальных карт, синастрии и мухурты.
В основе используются реальные звёздные созвездия (IAU) и положения планет, поэтому не требуется аянамша.

*Открытые лицензии:* меню «Программа → Лицензии (Open Source)» (файл `THIRD_PARTY_NOTICES.txt` в папке `resources`).

<*Как выполняются расчёты в Synastry*>
Synastry считает карту не по «равным знакам» 12×30° и не через вычитание аянамши. В основе — астрономические положения планет и реальные границы созвездий.

*Эклиптика J2000 и «истинные созвездия» IAU:*
- Положение каждой планеты и узлов вычисляется как эклиптическая долгота на эклиптике J2000 (астрономический расчёт).
- Внутри используются астрономические эфемериды (JPL DE421) и преобразования координат (астро-библиотеки), чтобы получить долготу на эклиптике J2000.
- Затем точка на эклиптике сопоставляется с реальным созвездием по границам IAU (International Astronomical Union) — они неравномерные, поэтому «знаки» в такой системе получаются разной протяжённости.
- Для удобства отображения созвездия сопоставляются 12 привычным знакам (например, Змееносец относится к Скорпиону), но базовая привязка идёт именно к IAU-дугам.

*Почему здесь нет аянамши?*
В большинстве ведических программ берут тропическую долготу на дату и затем «сдвигают зодиак» на выбранную аянамшу (Лахири и т.п.). Здесь логика другая: мы работаем в фиксированной системе отсчёта J2000 и привязываем положения к реальным созвездиям по IAU, поэтому отдельного шага «минус аянамша» нет.

*Почему может отличаться от других программ?*
- Границы созвездий не равны 30° — смена «знака» может происходить раньше/позже, чем в равнодольной системе.
- Асцендент ищется как точка пересечения восточного горизонта с эклиптикой (J2000), поэтому при неточных данных рождения (время/координаты) различия будут заметнее.
- Лунные узлы и планеты считаются по астрономическим эфемеридам, а не по упрощённым формулам.
- Ретроградность планет определяется по их реальному движению на эклиптике J2000.
- Накшатры и йога-тары считаются с учётом реального положения Луны относительно звёзд.
- Вимшотари-даши стартуют от реального положения Луны в накшатрах.

*Накшатры, йога-тары и Вимшотари:*
В приложении накшатры считаются на эклиптике J2000 как 27 равных сегментов по 13°20′ со сдвигом сетки Δ = 20°36′ (см. вкладку «Накшатра»). Сдвиг выбран так, чтобы согласовать сетку накшатр с «реальным небом» и опорными звёздами (йога-тарами) традиции (в т.ч. приводимыми в Брахма-самхите).
Идея простая: если Луна попадает в накшатру исходя из её реального положения относительно звёзд, то и точка старта Вимшотари-даши по Луне должна получаться ближе к наблюдаемой реальности, чем при расчёте в равнодольном зодиаке с фиксированной аянамшей.

<*Как считается совместимость (синастрия)*>
Совместимость в приложении — модульная оценка (проценты) + поясняющий текст. В базовую оценку входят:
- совместимость по ASC–ASC (таблица для 144 сочетаний восходящих знаков),
- Луна–Луна и Солнце–Солнце (взаимное положение по домам),
- Солнце↔Луна и Венера↔Марс (направленные пары с учётом пола партнёров),
- нумерология по датам рождения,
- корректировки: Куджа-доша (штраф) и бонус при совпадении домов Солнца и Луны у партнёров.

<*Описание натальной карты*>
Ведическая астрология рассматривает несколько карт для анализа личности и судьбы человека.
Сейчас в приложении доступны: Карта Асцендента (восходящего знака), Лунная, Солнечная, Санькхья-шастра.
Нумерология будет реализована в следующем обновлении.

<*Карта Асцендента:*>
 Это те данные, которые сопровождают нас всю жизнь, она имеет силу влияния 80% от своего описания.

<*Лунная карта*>
Вторая по важности - Чандра Лагна (или Лунная карта). После 30-ти лет она включается примерно на 50%. На третьем месте стоит Сурья Лагна (или солнечная карта).
Лунная карта активно включается после исполнения 30-ти лет человека или после его переезда.
Лунная карта показывает нас, во-первых, во второй половине жизни, и показывает нас с точки зрения ума, эмоций, эмоционального интеллекта.

<*Описание Лагнеши*>

<*Атма-карака*>
Это главная кармическая задача
Планета с самым большим градусом, сопоставима по значению с Лагнешей, планета души. По атмакараке мы смотрим кармические задачи и таланты. Атмарака - показывает душу человека, его сокравенные желание, настоящую личность. Самая важная кармическая задача, для чего пришла душа.

<*Дара-карака*>
Дара-карака указывает на партнёра по браку и бизнес партнёра.
Дара-карака - это планета, показатель жены/мужа в натальной карте. Дара-карака является одной из 8-ми чара-карак (чара-караки могут показывать тех людей, которые связаны с нами по карме).
Заключая узы брака, мы чаще всего представляем себе нашего будущего партнера по браку близким к идеалу, но всегда ли наши ожидания оправданы? Понять это вам поможет Дара-карака в вашем гороскопе.

<*Ретроградные планеты и задачи по ним*>
Ретроградная планета несёт дополнительную кармическую задачу. Причем, эту задачу вы не проработали с прошлой жизни. Ретроградные планеты показывают кармические связи. Соответственно, в том доме, где стоит ретроградная планета, и в том доме, которым она управляет, будут проблемы, будет кармическая задача, которую вы будете прорабатывать.
Чем критична ретроградная планета? Они на самом деле добавляют много проблем. Но есть хорошая новость, что их можно проработать. Если в вашей карте есть ретроградные планеты, то нужно прорабатывать. Если нет - то вам повезло. Но, если у вас есть ретроградные планеты, и вы уже здесь, то уже хорошо, вас карма пустила в знания, и мы будем прорабатывать. Ретроградные планеты дают серьезные блоки.
Ретроградная планета показывает во всех картах кармические задачи по тем домам (по тем сферам), в которых она стоит, которыми она управляет, и по знакам, в которых она стоит. В ретроградной планете её сила находится внутри и чтобы проработать эту планету, нужно усиленно работать. Её задача тянется с прошлой жизни. Чтобы проработать её, нужно достать её изнутри. Это как кокос, чтобы достать молоко, нужно очень много сил приложить.
В дни недели, соответствующие вашей ретроградной планеты, нужно делать по ней упайи, читать мантры, медитировать на эту планету, просить благословения.

В чем сложности ретроградных планет? Ретроградные планеты создают конкретные блоки, и людям с ретроградными планетами очень сложно, у них довольно не простой характер. Но мы можем достать потенциал ретроградной планеты.

Ретроградные планеты дают шанс изменить себя. Ретроградные планеты не причиняют открытого вреда, но они замедляют время получения тех или иных результатов и делают человека более сосредоточенным на себе. Такой человек как будто постоянно оглядывается назад.

<*Планетарные периоды - Вимшотари даши*>
Вимшотари даши показывает планетные периоды на 120 лет от рождения (по Луне, накшатры J2000).

Вверху выберите «Уровень» (1–5): чем выше уровень, тем детальнее разбиение периодов.

    <script>
      const state = {
        data: null,
        nodes: [],
        selectedId: null,
      };

      const normalizeSectionTitle = (value) => {
        const raw = String(value ?? "").trim();
        // Allow authors to write markers like <*Заголовок:*> or <<*Заголовок*>>.
        const withoutStars = raw.replace(/^\*+/, "").replace(/\*+$/, "").trim();
        return withoutStars.replace(/[:.]$/, "").trim();
      };

      const parseSectionMarker = (line) => {
        const trimmed = String(line ?? "").trim();
        if (!trimmed) return null;
        if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) return null;

        // Multi-line section header on its own line:
        //   <Заголовок>
        //   <<Заголовок>>
        let match = trimmed.match(/^<<([^<>]+)>>$/);
        if (match) return { kind: "start", title: normalizeSectionTitle(match[1]) };
        match = trimmed.match(/^<([^<>]+)>$/);
        if (match) return { kind: "start", title: normalizeSectionTitle(match[1]) };

        // Single-line section:
        //   <<Заголовок>текст справа>
        match = trimmed.match(/^<<([^<>]+)>([\s\S]*)>$/);
        if (match) {
          return {
            kind: "inline",
            title: normalizeSectionTitle(match[1]),
            body: String(match[2] ?? "").trim(),
          };
        }

        return null;
      };

      const escapeHtml = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const linkify = (escapedText) => {
        return String(escapedText).replace(/https?:\/\/[^\s]+/gi, (raw) => {
          let url = raw;
          let trailing = "";
          while (/[).,\]]$/.test(url)) {
            trailing = url.slice(-1) + trailing;
            url = url.slice(0, -1);
          }
          if (!url) return escapeHtml(raw);
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
        });
      };

      const applyInlineBold = (escapedHtml) => {
        let out = String(escapedHtml);
        // Markdown-like bold: **text**
        out = out.replace(/\*\*([^*][^]*?)\*\*/g, "<strong>$1</strong>");
        // Single-star bold: *text*
        out = out.replace(/\*([^*\s][^]*?[^*\s])\*/g, "<strong>$1</strong>");
        return out;
      };

      const formatHelpText = (text) => {
        const raw = String(text ?? "").replace(/\r\n/g, "\n");
        const lines = raw.split("\n");
        return lines
          .map((line) => {
            const escaped = escapeHtml(line);
            let out = applyInlineBold(escaped);
            return linkify(out);
          })
          .join("\n");
      };

      const slugify = (input) =>
        String(input ?? "")
          .toLowerCase()
          .replace(/[^a-zа-яё0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60) || "section";

      const buildSections = (lines) => {
        const cleanLines = Array.isArray(lines) ? lines.map((x) => String(x ?? "")) : [];
        const sections = [];
        let current = null;
        let markerIndex = 0;

        const flush = () => {
          if (!current) return;
          sections.push(current);
          current = null;
        };

        for (let i = 0; i < cleanLines.length; i++) {
          const line = cleanLines[i];
          const marker = parseSectionMarker(line);
          if (marker?.kind === "start") {
            flush();
            markerIndex += 1;
            const title = marker.title || `Раздел ${markerIndex}`;
            current = { id: `sec-${slugify(title)}-${markerIndex}`, title, lines: [] };
            continue;
          }
          if (marker?.kind === "inline") {
            flush();
            markerIndex += 1;
            const title = marker.title || `Раздел ${markerIndex}`;
            const body = marker.body || "";
            sections.push({ id: `sec-${slugify(title)}-${markerIndex}`, title, lines: [body] });
            continue;
          }
          if (!current) continue;
          current.lines.push(line);
        }

        flush();
        return sections;
      };

      const getNodeById = (id) => state.nodes.find((node) => node.id === id) ?? null;

      const setSelected = (id) => {
        const node = getNodeById(id);
        if (!node) return;
        state.selectedId = id;

        document.querySelectorAll(".tree-btn").forEach((btn) => {
          btn.classList.toggle("selected", btn.dataset.nodeId === id);
        });

        const titleEl = document.getElementById("page-title");
        const metaEl = document.getElementById("page-meta");
        const textEl = document.getElementById("page-text");

        titleEl.textContent = node.title;
        metaEl.textContent = state.data?.appName && state.data?.version ? `${state.data.appName} ${state.data.version}` : "";
        textEl.innerHTML = formatHelpText(node.text);
      };

      const renderTree = () => {
        const tree = document.getElementById("tree");
        tree.innerHTML = "";

        const makeButton = (node) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tree-btn";
          btn.dataset.nodeId = node.id;
          btn.textContent = node.title;
          btn.addEventListener("click", () => setSelected(node.id));
          return btn;
        };

        const rootNode = state.nodes.find((n) => n.parentId == null);
        if (!rootNode) return;

        const rootLi = document.createElement("li");
        rootLi.className = "tree-item";
        rootLi.appendChild(makeButton(rootNode));

        const children = state.nodes.filter((n) => n.parentId === rootNode.id);
        if (children.length) {
          const ul = document.createElement("ul");
          ul.className = "tree-children";
          children.forEach((child) => {
            const li = document.createElement("li");
            li.className = "tree-item";
            li.appendChild(makeButton(child));
            ul.appendChild(li);
          });
          rootLi.appendChild(ul);
        }

        tree.appendChild(rootLi);
      };

      const applyFilter = () => {
        const raw = document.getElementById("filter").value || "";
        const query = raw.trim().toLowerCase();
        const tree = document.getElementById("tree");
        if (!tree) return;

        const buttons = tree.querySelectorAll(".tree-btn");
        if (!query) {
          buttons.forEach((btn) => (btn.style.display = ""));
          return;
        }

        buttons.forEach((btn) => {
          const title = (btn.textContent || "").toLowerCase();
          btn.style.display = title.includes(query) ? "" : "none";
        });
      };

      const initTabs = () => {
        const tabContents = document.getElementById("tab-contents");
        const tabIndex = document.getElementById("tab-index");
        const tree = document.getElementById("tree");
        const filter = document.getElementById("filter");
        const index = document.getElementById("index");

        const setActive = (which) => {
          const isContents = which === "contents";
          tabContents.classList.toggle("active", isContents);
          tabIndex.classList.toggle("active", !isContents);
          tree.style.display = isContents ? "" : "none";
          filter.style.display = isContents ? "" : "none";
          index.style.display = isContents ? "none" : "";
        };

        tabContents.addEventListener("click", () => setActive("contents"));
        tabIndex.addEventListener("click", () => setActive("index"));
      };

      const readEmbeddedLines = () => {
        const el = document.getElementById("embedded-calculations");
        const raw = String(el?.textContent ?? "");
        if (!raw.trim()) return [];
        return raw.replace(/\r\n/g, "\n").split("\n");
      };

      async function init() {
        initTabs();
        document.getElementById("filter").addEventListener("input", applyFilter);

        let data = null;
        try {
          const api = window.helpAPI;
          if (api?.getCalculations) {
            data = await api.getCalculations();
          }
        } catch {
          data = null;
        }

        state.data = data || {
          appName: "Synastry",
          version: "",
          title: "Помощь",
          lines: readEmbeddedLines(),
        };

        const appName = state.data.appName || "Synastry";
        const version = state.data.version || "";
        const rootTitle = state.data.title || "Помощь";
        const lines = Array.isArray(state.data.lines) ? state.data.lines : [];

        document.title = `${rootTitle} - ${appName}${version ? " " + version : ""}`;

        const fullText = lines.join("\n");
        let sections = [];
        try {
          sections = buildSections(lines);
        } catch (error) {
          console.warn("Failed to build help sections", error);
          sections = [];
        }

        state.nodes = [
          { id: "root", parentId: null, title: rootTitle, text: fullText },
          ...sections.map((s) => ({
            id: s.id,
            parentId: "root",
            title: s.title,
            text: (Array.isArray(s.lines) ? s.lines : []).join("\n").trim(),
          })),
        ];

        renderTree();
        const firstChild = state.nodes.find((n) => n.parentId === "root");
        setSelected(firstChild?.id ?? "root");
      }

      void init();
    </script>
  </body>
</html>
